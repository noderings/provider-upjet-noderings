# Every commit in a pull request must carry a Developer Certificate of Origin
# sign-off (git commit -s). See CONTRIBUTING.md.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%ae' "$c")
            # Release pull requests and dependency updates are made by bots.
            case "$author" in *"[bot]@users.noreply.github.com") continue ;; esac
            # Fixed-string match: addresses such as 123+name@users.noreply.github.com contain regex characters.
            if ! git log -1 --format='%B' "$c" | grep -i '^Signed-off-by: ' | grep -qiF "<${author}>"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line for ${author}"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with: git commit --amend -s (or git rebase --signoff $BASE)"
            exit 1
          fi
          echo "All commits are signed off."
