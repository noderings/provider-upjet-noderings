apiVersion: dns.noderings.m.crossplane.io/v1alpha1
kind: GeoRecord
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1alpha1/georecord
  labels:
    testing.upbound.io/example-name: app
  name: app
  namespace: default
spec:
  forProvider:
    continents:
      EU: 198.51.100.10
    countries:
      JP: 203.0.113.10
