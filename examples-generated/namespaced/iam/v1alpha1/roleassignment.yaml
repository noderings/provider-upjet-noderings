apiVersion: iam.m.noderings.com/v1alpha1
kind: RoleAssignment
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1alpha1/roleassignment
  labels:
    testing.upbound.io/example-name: ops
  name: ops
  namespace: default
spec:
  forProvider:
    groupIdSelector:
      matchLabels:
        testing.upbound.io/example-name: ops
    roleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: noderings_role

---

apiVersion: iam.m.noderings.com/v1alpha1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1alpha1/roleassignment
  labels:
    testing.upbound.io/example-name: ops
  name: ops
  namespace: default
spec:
  forProvider:
    name: ops
