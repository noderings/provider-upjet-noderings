apiVersion: iam.m.noderings.com/v1alpha1
kind: SSHKey
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1alpha1/sshkey
  labels:
    testing.upbound.io/example-name: laptop
  name: laptop
  namespace: default
spec:
  forProvider:
    name: laptop
    publicKey: ${file("~/.ssh/id_ed25519.pub")}
