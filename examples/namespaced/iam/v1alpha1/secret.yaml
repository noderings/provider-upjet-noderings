# An organization secret whose value comes from a Kubernetes Secret, and a
# plain environment variable. Free.
apiVersion: v1
kind: Secret
metadata:
  name: registry-password
  namespace: default
type: Opaque
stringData:
  value: example-value-change-me
---
apiVersion: iam.noderings.m.crossplane.io/v1alpha1
kind: Secret
metadata:
  name: registry-password
  namespace: default
  annotations:
    meta.upbound.io/example-id: iam/v1alpha1/secret
spec:
  forProvider:
    key: registry_password_${Rand.RFC1123Subdomain}
    valueSecretRef:
      name: registry-password
      key: value
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
---
apiVersion: iam.noderings.m.crossplane.io/v1alpha1
kind: EnvironmentVariable
metadata:
  name: log-level
  namespace: default
  annotations:
    meta.upbound.io/example-id: iam/v1alpha1/secret
spec:
  forProvider:
    # Lower-case letters, digits and _ only. Upjet does not run the Terraform
    # provider's input validation, so an invalid key reaches the API.
    key: crossplane_example_log_level
    value: info
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
