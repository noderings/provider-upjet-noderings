    schema:
      openAPIV3Schema:
        description: RulesetRules is the Schema for the RulesetRuless API. The rules
          of one firewall ruleset, as one ordered list. Use one noderings_firewall_ruleset_rules
          per ruleset. Rules are evaluated top to bottom, ingress and egress in one
          list, and the first matching rule decides. Traffic that matches no rule
          is accepted, so for a default-deny policy end the list with drop rules for
          0.0.0.0/0 and ::/0. Changes reach the virtual machines the ruleset is attached
          to within about a minute; the API does not report when they are applied.
